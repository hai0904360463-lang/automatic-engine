name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Lấy code từ repo
        uses: actions/checkout@v4

      - name: Cài Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Tạo cấu trúc lib nếu chưa có và chuyển main.dart vào lib
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          fi

      - name: Tạo cấu trúc ios/Runner và đưa Info.plist vào đúng vị trí
        run: |
          mkdir -p ios/Runner
          if [ -f Info.plist ]; then
            cp Info.plist ios/Runner/Info.plist
          fi

      - name: Tự động sinh khung project iOS/Android nếu thiếu
        run: flutter create . --platforms=ios,android --project-name speedo_app

      - name: Lấy các package
        run: flutter pub get

      - name: Chuẩn bị cấu hình Xcode
        run: flutter build ios --release --no-codesign --config-only

      - name: Build thủ công bằng xcodebuild (Tắt Code Signing)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual \
            -derivedDataPath ../build/ios_manual \
            clean build

      - name: Đóng gói file .ipa
        run: |
          cd build/ios_manual/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r speedo_app.ipa Payload
          cd -
          mv build/ios_manual/Build/Products/Release-iphoneos/speedo_app.ipa .

      - name: Upload file .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedo_app-ipa
          path: speedo_app.ipa
